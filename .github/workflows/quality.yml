
name: Research dashboard checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Ensure Streamlit is installed
        run: python -c "import streamlit; print(streamlit.__version__)"

      - name: Core tests and real Streamlit AppTest
        run: python -m unittest discover -s tests -v

      - name: Start real Streamlit server and verify HTTP health
        run: python scripts/smoke_http.py
